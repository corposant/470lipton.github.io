name: Build & test

on:
  push:
    branches: [app]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen

      - name: Pick an iPhone simulator
        id: sim
        run: |
          xcodebuild -version
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, items in sorted(devices.items(), reverse=True):
              if "iOS" in runtime:
                  for d in items:
                      if d["name"].startswith("iPhone"):
                          print(d["udid"]); sys.exit()
          ')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Nog.xcodeproj \
            -scheme Nog \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "error:|warning: .*(Nog|NogTests)/|Test Case .* (passed|failed)|\*\* (BUILD|TEST) " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build.log

      - name: Show errors
        if: failure()
        run: grep -E "error:|failed" -A3 build.log | head -150 || true
