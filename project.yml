name: Nog
options:
  bundleIdPrefix: dev.nog
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true

settings:
  base:
    # ▶︎ The app's bundle ID, registered to Scott's team. It's permanent once a build
    #   is uploaded to App Store Connect, so don't change it after that.
    #   The widget's ID and the App Group follow automatically.
    NOG_BUNDLE_ID: com.ticknor.nog
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Needs Xcode 27 (iOS 27 SDK).
    # Apple Team ID (developer.apple.com/account → Membership), so Xcode signs
    # without re-picking the team every time you run xcodegen.
    DEVELOPMENT_TEAM: MWYUVD6HA5
    CODE_SIGN_STYLE: Automatic

targets:
  Nog:
    type: application
    platform: iOS
    sources: [Nog, Shared]
    dependencies:
      - target: NogWidgets
    info:
      path: Nog/Info.plist
      properties:
        CFBundleDisplayName: Nog
        # Nog only uses the encryption built into iOS (HTTPS, file protection), which is
        # exempt, so App Store Connect doesn't ask about export compliance on every upload.
        ITSAppUsesNonExemptEncryption: false
        # Other ways Siri may hear "Nog" (a short, unusual word), so phrases like
        # "Take a Nog" still match when Siri hears "Nog app", "Nogg" or "Knog".
        INAlternativeAppNames:
          - INAlternativeAppName: Nog app
          - INAlternativeAppName: Nogg
          - INAlternativeAppName: Knog
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Makes the Items folder visible in the Files app (On My iPhone → Nog)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [io.nogapp.nog.refresh]
        NSSupportsLiveActivities: true
        # Widgets read a snapshot of your nogs from this shared container.
        NogAppGroup: group.$(NOG_BUNDLE_ID)
        # Widget taps open nog://item/<id>
        CFBundleURLTypes:
          - CFBundleURLName: $(NOG_BUNDLE_ID)
            CFBundleURLSchemes: [nog]
        NSAlarmKitUsageDescription: Nog rings like an alarm for the items you mark as can't-miss.
        # Shows the app's iCloud folder as "Nog" in iCloud Drive (Files app, Finder)
        NSUbiquitousContainers:
          iCloud.com.ticknor.nog:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Nog
            NSUbiquitousContainerSupportedFolderLevels: Any
    # The App Group lets the widgets read your nogs (needs the paid Apple Developer Program;
    # Xcode's automatic signing registers the group the first time you build).
    entitlements:
      path: Nog/Nog.entitlements
      properties:
        com.apple.security.application-groups: [group.$(NOG_BUNDLE_ID)]
        # Lets nogs break through Focus (the person still allows it per app in Settings).
        com.apple.developer.usernotifications.time-sensitive: true
        # iCloud Drive sync: each item is a Markdown file in iCloud Drive → Nog, so it's
        # backed up and on your other devices. Without iCloud, items stay on the phone and
        # move to iCloud automatically once it's available.
        com.apple.developer.icloud-container-identifiers: [iCloud.com.ticknor.nog]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.ticknor.nog]
        com.apple.developer.icloud-services: [CloudDocuments]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NOG_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Settings → Appearance → App icon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Neon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: [NogTests]

  # Live Activity for ▶︎ Doing (Lock Screen, Dynamic Island, Watch, CarPlay),
  # plus the Nogitivity widgets (Home Screen and Lock Screen)
  NogWidgets:
    type: app-extension
    platform: iOS
    sources: [NogWidgets, Shared]
    info:
      path: NogWidgets/Info.plist
      properties:
        CFBundleDisplayName: Nog
        NogAppGroup: group.$(NOG_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NogWidgets/NogWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.$(NOG_BUNDLE_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NOG_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"

  NogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NogTests]
    dependencies:
      - target: Nog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
