name: Nog
options:
  bundleIdPrefix: dev.nog
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true

settings:
  base:
    # ▶︎ The app's bundle ID. Bundle IDs are unique across all developers, so if Xcode
    #   says this one is unavailable, change just this line (e.g. com.<yourname>.nog)
    #   and run ./update.sh. The widget's ID follows automatically.
    NOG_BUNDLE_ID: com.ticknor.blerg.nog
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Needs Xcode 27 (iOS 27 SDK).
    # Put your Apple Team ID here (developer.apple.com/account → Membership)
    # so you don't have to re-pick it in Xcode every time you run xcodegen.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Nog:
    type: application
    platform: iOS
    sources: [Nog, Shared]
    dependencies:
      - target: NogWidgets
    info:
      path: Nog/Info.plist
      properties:
        CFBundleDisplayName: Nog
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Makes the Items folder visible in the Files app (On My iPhone → Nog)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [io.nogapp.nog.refresh]
        NSSupportsLiveActivities: true
        # Widgets read a snapshot of your nogs from this shared container.
        NogAppGroup: group.$(NOG_BUNDLE_ID)
        # Widget taps open nog://item/<id>
        CFBundleURLTypes:
          - CFBundleURLName: $(NOG_BUNDLE_ID)
            CFBundleURLSchemes: [nog]
        NSAlarmKitUsageDescription: Nog rings like an alarm for the items you mark as can't-miss.
        # Shows the app's iCloud folder as "Nog" in iCloud Drive (Files app, Finder)
        NSUbiquitousContainers:
          iCloud.io.nogapp.nog:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Nog
            NSUbiquitousContainerSupportedFolderLevels: Any
    # Paid Apple Developer Program only, so these are off for now. When you upgrade,
    # uncomment the block and re-run xcodegen.
    #   • App Group: lets the widgets read your nogs (also uncomment it on NogWidgets below).
    #   • iCloud Drive sync: items are stored on the phone until then; Nog moves them
    #     into iCloud Drive on its next launch.
    # entitlements:
    #   path: Nog/Nog.entitlements
    #   properties:
    #     com.apple.security.application-groups: [group.$(NOG_BUNDLE_ID)]
    #     com.apple.developer.icloud-container-identifiers: [iCloud.io.nogapp.nog]
    #     com.apple.developer.ubiquity-container-identifiers: [iCloud.io.nogapp.nog]
    #     com.apple.developer.icloud-services: [CloudDocuments]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NOG_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Settings → Appearance → App icon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Neon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: [NogTests]

  # Live Activity for ▶︎ Doing (Lock Screen, Dynamic Island, Watch, CarPlay),
  # plus the Nogitivity widgets (Home Screen and Lock Screen)
  NogWidgets:
    type: app-extension
    platform: iOS
    sources: [NogWidgets, Shared]
    info:
      path: NogWidgets/Info.plist
      properties:
        CFBundleDisplayName: Nog
        NogAppGroup: group.$(NOG_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    # App Group (paid account): uncomment together with the app's entitlements above.
    # entitlements:
    #   path: NogWidgets/NogWidgets.entitlements
    #   properties:
    #     com.apple.security.application-groups: [group.$(NOG_BUNDLE_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NOG_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"

  NogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NogTests]
    dependencies:
      - target: Nog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
