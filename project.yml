name: Nag
options:
  bundleIdPrefix: io.nagme
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Put your Apple Team ID here (developer.apple.com/account → Membership)
    # so you don't have to re-pick it in Xcode every time you run xcodegen.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Nag:
    type: application
    platform: iOS
    sources: [Nag]
    info:
      path: Nag/Info.plist
      properties:
        CFBundleDisplayName: Nag
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Makes the Items folder visible in the Files app (On My iPhone → Nag)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [io.nagme.nag.refresh]
    settings:
      base:
        # Bundle IDs are globally unique. If Xcode says this one is taken,
        # change it to something like com.<yourname>.nag
        PRODUCT_BUNDLE_IDENTIFIER: io.nagme.nag
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: [NagTests]

  NagTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NagTests]
    dependencies:
      - target: Nag
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
